<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your Hound password</title>
<meta name="description" content="Choose a new password for your Hound account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="15.2" r="4.1" fill="#9184d9"/>
        <circle cx="5.1" cy="9.4" r="2.1" fill="#9184d9"/>
        <circle cx="18.9" cy="9.4" r="2.1" fill="#9184d9"/>
        <circle cx="8.3" cy="4.6" r="2" fill="#9184d9"/>
        <circle cx="15.7" cy="4.6" r="2" fill="#9184d9"/>
      </svg>
    </div>
    <div class="brand-name">Hound</div>
  </header>

  <div class="card" id="reset-card">
    <h2 class="section-title">Reset your password</h2>
    <p class="section-sub" id="reset-sub">Verifying your reset link…</p>

    <form id="form-reset" style="display:none">
      <div class="field">
        <label for="rp-password">New password</label>
        <input id="rp-password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required>
      </div>
      <div class="field">
        <label for="rp-confirm">Confirm new password</label>
        <input id="rp-confirm" name="confirm" type="password" autocomplete="new-password" placeholder="••••••••" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="rp-submit">Set new password</button>
      <p class="form-note" id="rp-note"></p>
    </form>
  </div>

</div>

<!-- Absolute paths, not relative — this page can be reached via a
     redirect from index.html (see app.js's own PASSWORD_RECOVERY
     handling), which may leave the browser's history/base in a state
     where a relative "config.js" doesn't resolve the way it would from
     a plain, direct visit. -->
<script src="/vendor/supabase-js/supabase.js"></script>
<script src="/config.js"></script>
<script src="/reset-password.js"></script>
</body>
</html>
